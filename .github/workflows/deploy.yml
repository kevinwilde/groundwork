name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one still in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Local installs can go through a private registry proxy (https://<proxy>/npm/<package>/-/...),
      # which the runner can't log in to. Fetch the same tarballs from the public registry instead;
      # the lockfile's integrity hashes still verify them.
      - name: Use the public npm registry
        run: |
          sed -i -E 's#"resolved": "https://[^"/]+/npm/(@?[^"]+/-/[^"]+\.tgz)"#"resolved": "https://registry.npmjs.org/\1"#' package-lock.json
      - run: npm ci
      - run: npm test
      # Type-checks, builds the PWA into dist/ (icons are generated from public/logo.svg).
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
